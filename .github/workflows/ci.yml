name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: >
          python -m compileall -q
          src
          airflow/dags
          tests
          infra/superset

      - name: Run unit tests
        run: python -m pytest

      - name: Parse dbt project
        run: >
          dbt parse
          --project-dir austin_crime
          --profiles-dir airflow/dbt

      - name: Validate Docker Compose
        env:
          SOCRATA_APP_TOKEN: ci-token
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: ci-postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: ci-lakehouse
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password
          GRAFANA_ADMIN_USER: ci-admin
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
          SUPERSET_DATABASE: superset
          SUPERSET_SECRET_KEY: ci-superset-secret-key-not-for-real-use
        run: docker compose config --quiet

      - name: Build Airflow image
        run: >
          docker build
          --file airflow/Dockerfile
          --tag austin-crime-airflow:ci
          .

      - name: Build Superset image
        run: >
          docker build
          --file infra/superset/Dockerfile
          --tag austin-crime-superset:ci
          .
