services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"

    ports:
      - '9000:9000'
      - '9001:9001'

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

  spark:
    image: spark:3.5.8-scala2.12-java17-python3-ubuntu
    command: ['sleep', 'infinity']

    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./src/processing:/opt/spark/work-dir
      - ./tests:/opt/spark/tests:ro

    depends_on:
      - minio
      - postgres

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  trino:
    image: trinodb/trino:483
    ports:
      - '8080:8080'
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
    depends_on:
      - minio
      - postgres

  airflow:
    image: austin-crime-airflow:3.3.0

    build:
      context: .
      dockerfile: airflow/Dockerfile

    command: standalone

    ports:
      - '8082:8080'

    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

      PYTHONPATH: /opt/airflow/project

      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN}

      TRINO_HOST: trino

      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1

      DBT_PROFILES_DIR: /opt/airflow/dbt

      AIRFLOW__METRICS__STATSD_ON: 'true'
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: '9125'
      AIRFLOW__METRICS__STATSD_PREFIX: airflow

    volumes:
      - airflow_data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data
      - ./austin_crime:/opt/airflow/project/austin_crime
      - ./airflow/dbt:/opt/airflow/dbt:ro

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'airflow db check && airflow jobs check --job-type SchedulerJob --allow-multiple --limit 100',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    depends_on:
      minio:
        condition: service_started

      postgres:
        condition: service_healthy

      trino:
        condition: service_started

      statsd-exporter:
        condition: service_started

  statsd-exporter:
    image: prom/statsd-exporter:v0.29.0
    container_name: austin-crime-statsd-exporter
    restart: unless-stopped
    ports:
      - '9102:9102'
    expose:
      - '9125/udp'

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: austin-crime-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - statsd-exporter

  grafana:
    image: grafana/grafana:13.1.0
    container_name: austin-crime-grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  superset:
    image: austin-crime-superset:6.0.0

    build:
      context: .
      dockerfile: infra/superset/Dockerfile

    ports:
      - '8088:8088'

    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DATABASE: ${SUPERSET_DATABASE}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - superset_data:/app/superset_home
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro

    healthcheck:
      test:
        [
          'CMD',
          '/app/.venv/bin/python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  minio_data:
  postgres_data:
  airflow_data:
  prometheus_data:
  grafana_data:
  superset_data:
